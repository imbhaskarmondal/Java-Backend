<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration App</title>
</head>
<body>
<h1>Kindly enter your details to register.</h1>
	<form method="post" action="./Register">
		<table>
			<tr>
				<td>User Name: </td>
				<td> <input type="text" name="uname"> </td>
			</tr>
			<tr>
				<td>User Email: </td>
				<td> <input type="email" name="email"> </td>
			</tr>
			<tr>
				<td>User Password: </td>
				<td> <input type="password" name="password"> </td>
			</tr>
			<tr>
				<td>User City: </td>
				<td> <input type="text" name="ucity"> </td>
			</tr>
			<tr>
				<td> <input type="submit" value="Register"> </td>
			</tr>
		</table>
	</form>
</body>
</html>
